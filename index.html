<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfólio Moderno | Seu Nome</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <style>
        :root {
            --cor-primaria: #0a0a0a;
            --cor-secundaria: #f5f5f5;
            --cor-destaque: #7000ff;
            --gradiente-destaque: linear-gradient(45deg, #7000ff, #ff00f5);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: var(--cor-primaria);
            color: var(--cor-secundaria);
            overflow-x: hidden;
        }

        /* Efeito de partículas */
        #particles-js {
            position: fixed;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        /* Cursor personalizado */
        .cursor {
            width: 30px;
            height: 30px;
            border: 2px solid var(--cor-destaque);
            border-radius: 50%;
            position: fixed;
            pointer-events: none;
            mix-blend-mode: difference;
            transition: all 0.3s ease;
            z-index: 9999;
        }

        .cursor-inner {
            width: 6px;
            height: 6px;
            background: var(--cor-destaque);
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            transition: width 0.3s, height 0.3s;
        }

        /* Header moderno */
        header {
            position: fixed;
            width: 100%;
            padding: 1.5rem 5%;
            background: rgba(10, 10, 10, 0.8);
            backdrop-filter: blur(15px);
            z-index: 1000;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1400px;
            margin: 0 auto;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 800;
            background: var(--gradiente-destaque);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Seção Hero com Parallax */
        .hero {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .hero-content {
            text-align: center;
            position: relative;
            z-index: 1;
        }

        .hero h1 {
            font-size: 4.5rem;
            margin-bottom: 1.5rem;
            background: var(--gradiente-destaque);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .animated-text {
            display: inline-block;
            position: relative;
        }

        .animated-text::after {
            content: "";
            position: absolute;
            width: 3px;
            height: 80%;
            background: var(--cor-destaque);
            right: -10px;
            top: 10%;
            animation: blink 0.8s infinite;
        }

        /* Cards 3D */
        .tech-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 2rem;
            padding: 2rem;
        }

        .tech-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 2rem;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-style: preserve-3d;
            position: relative;
            cursor: pointer;
            backdrop-filter: blur(10px);
        }

        .tech-card:hover {
            transform: rotateX(10deg) rotateY(10deg) translateZ(20px);
            background: rgba(255, 255, 255, 0.1);
        }

        /* Projetos com hover expand */
        .project-card {
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            transition: all 0.4s;
            transform-origin: center;
        }

        .project-card:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(112, 0, 255, 0.3);
        }

        .project-overlay {
            position: absolute;
            bottom: -100%;
            left: 0;
            width: 100%;
            padding: 2rem;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.9));
            transition: all 0.4s;
        }

        .project-card:hover .project-overlay {
            bottom: 0;
        }

        /* Animations */
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* Responsivo */
        @media (max-width: 768px) {
            .hero h1 { font-size: 3rem; }
            .tech-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="cursor"></div>
    <div class="cursor-inner"></div>
    <div id="particles-js"></div>

    <header>
        <nav>
            <div class="logo" data-aos="fade-down">SeuNome</div>
            <div class="nav-links">
                <a href="#tecnologias" data-aos="fade-down" data-aos-delay="100">Tecnologias</a>
                <a href="#projetos" data-aos="fade-down" data-aos-delay="200">Projetos</a>
                <a href="#contato" data-aos="fade-down" data-aos-delay="300">Contato</a>
            </div>
        </nav>
    </header>

    <section class="hero">
        <div class="hero-content" data-aos="zoom-in" data-aos-duration="1000">
            <h1>Transformando ideias em<br><span class="animated-text">experiências digitais</span></h1>
            <div class="hero-buttons" data-aos="fade-up" data-aos-delay="500">
                <a href="#projetos" class="cta-btn">Ver Projetos</a>
                <a href="#contato" class="cta-btn outline">Contato</a>
            </div>
        </div>
    </section>

    <section id="tecnologias" class="section">
    <div class="tech-grid">
        <!-- React -->
        <div class="tech-card" data-aos="flip-left">
            <i class="fab fa-react fa-3x"></i>
            <h3>React</h3>
            <div class="skill-bar">
                <div class="skill-progress" style="width: 90%"></div>
            </div>
        </div>

        <!-- HTML -->
        <div class="tech-card" data-aos="flip-left">
            <i class="fab fa-html5 fa-3x"></i>
            <h3>HTML5</h3>
            <div class="skill-bar">
                <div class="skill-progress" style="width: 95%"></div>
            </div>
        </div>

        <!-- CSS -->
        <div class="tech-card" data-aos="flip-left">
            <i class="fab fa-css3-alt fa-3x"></i>
            <h3>CSS3</h3>
            <div class="skill-bar">
                <div class="skill-progress" style="width: 90%"></div>
            </div>
        </div>

        <!-- JavaScript -->
        <div class="tech-card" data-aos="flip-left">
            <i class="fab fa-js-square fa-3x"></i>
            <h3>JavaScript</h3>
            <div class="skill-bar">
                <div class="skill-progress" style="width: 85%"></div>
            </div>
        </div>

        <!-- Node.js -->
        <div class="tech-card" data-aos="flip-left">
            <i class="fab fa-node-js fa-3x"></i>
            <h3>Node.js</h3>
            <div class="skill-bar">
                <div class="skill-progress" style="width: 75%"></div>
            </div>
        </div>

        <!-- Git -->
        <div class="tech-card" data-aos="flip-left">
            <i class="fab fa-git-alt fa-3x"></i>
            <h3>Git</h3>
            <div class="skill-bar">
                <div class="skill-progress" style="width: 85%"></div>
            </div>
        </div>

        <!-- Tailwind CSS -->
        <div class="tech-card" data-aos="flip-left">
            <i class="fas fa-wind fa-3x"></i> <!-- Não há ícone oficial do Tailwind no Font Awesome -->
            <h3>Tailwind CSS</h3>
            <div class="skill-bar">
                <div class="skill-progress" style="width: 80%"></div>
            </div>
        </div>

        <!-- Express.js -->
        <div class="tech-card" data-aos="flip-left">
            <i class="fas fa-server fa-3x"></i>
            <h3>Express.js</h3>
            <div class="skill-bar">
                <div class="skill-progress" style="width: 70%"></div>
            </div>
        </div>

        


    <section id="projetos">
        <div class="projects-grid">
            <!-- Projeto com overlay -->
            <div class="project-card" data-aos="fade-up">
                <div class="project-image">
                    <img src="projeto1.jpg" alt="Projeto">
                </div>
                <div class="project-overlay">
                    <h3>Projeto Inovador</h3>
                    <p>Tecnologias usadas: React, Node.js, MongoDB</p>
                    <div class="project-links">
                        <a href="#"><i class="fab fa-github"></i></a>
                        <a href="#"><i class="fas fa-external-link-alt"></i></a>
                    </div>
                </div>
            </div>
            <!-- Adicione mais projetos -->
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        // Inicializa AOS (Animate On Scroll)
        AOS.init({
            duration: 1000,
            once: true,
        });

        // Efeito de partículas
        particlesJS('particles-js', {
            particles: {
                number: { value: 80 },
                color: { value: '#7000ff' },
                shape: { type: 'circle' },
                opacity: { value: 0.5 },
                size: { value: 3 },
                move: {
                    enable: true,
                    speed: 2,
                    direction: 'none',
                    random: false,
                    straight: false,
                    out_mode: 'out',
                    bounce: false,
                }
            },
            interactivity: {
                detect_on: 'canvas',
                events: {
                    onhover: { enable: true, mode: 'repulse' },
                    onclick: { enable: true, mode: 'push' },
                    resize: true
                }
            }
        });

        // Cursor personalizado
        const cursor = document.querySelector('.cursor');
        const cursorInner = document.querySelector('.cursor-inner');
        
        document.addEventListener('mousemove', (e) => {
            cursor.style.transform = `translate(${e.clientX}px, ${e.clientY}px)`;
            cursorInner.style.transform = `translate(${e.clientX}px, ${e.clientY}px)`;
        });

        // Efeito hover cursor
        document.querySelectorAll('a, button').forEach(el => {
            el.addEventListener('mouseenter', () => {
                cursor.classList.add('hover');
                cursorInner.classList.add('hover');
            });
            el.addEventListener('mouseleave', () => {
                cursor.classList.remove('hover');
                cursorInner.classList.remove('hover');
            });
        });
    </script>
</body>
</html>
